name: CI/CD Pipeline

on:
  push:
    # This ensures the CI runs on main, develop, AND any feature branches
    branches: [ "main", "develop", "feature/*" ]

jobs:
  ci-build-and-test:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: ./mvnw clean test

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push the image to GHCR if we are on develop or main.
          # On feature branches, it builds to ensure the Dockerfile isn't broken.
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ghcr.io/roygicheru/simple-bank:latest
            ghcr.io/roygicheru/simple-bank:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd-deploy-to-prod:
    name: Continuous Deployment (Prod)
    runs-on: ubuntu-latest
    needs: ci-build-and-test
    # ONLY runs if the push/merge happened on the main branch.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/
            docker-compose pull app
            docker-compose up -d --force-recreate --remove-orphans app
            docker image prune -f