<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>simplebank</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .balance { font-size: 2em; color: #2ecc71; margin: 20px 0; font-weight: bold; }
        .error { color: #e74c3c; font-size: 0.9em; margin-bottom: 15px; }
        input[type="number"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-deposit { background-color: #3498db; }
        .btn-deposit:hover { background-color: #2980b9; }
        .btn-withdraw { background-color: #e67e22; }
        .btn-withdraw:hover { background-color: #d35400; }
    </style>
</head>
<body>
<div class="card">
    <h2> Simple Bank.</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div>Balance:</div>
    <div class="balance">$<span th:text="${balance}">0.00</span></div>

    <form th:action="@{/deposit}" method="post">
        <input type="number" name="amount" step="0.01" min="0.01" placeholder="Amount" required id="deposit-input">
        <button type="submit" class="btn-deposit" id="deposit-btn">Deposit</button>
    </form>

    <form th:action="@{/withdraw}" method="post">
        <input type="number" name="amount" step="0.01" min="0.01" placeholder="Amount" required id="withdraw-input">
        <button type="submit" class="btn-withdraw" id="withdraw-btn">Withdraw</button>
    </form>
</div>
</body>
</html>
